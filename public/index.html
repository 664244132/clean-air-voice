<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clean Air Voice Assistant</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#fff;min-height:100vh;display:grid;place-items:center}
    .card{width:min(900px,92vw);background:#111827;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0006;text-align:center}
    h1{margin-top:0}.status{font-size:1.2rem;padding:14px;border-radius:14px;background:#1f2937;margin:16px 0}
    button{font-size:1.05rem;padding:12px 18px;border:0;border-radius:12px;margin:6px;cursor:pointer}
    #start{background:#22c55e}#stop{background:#ef4444;color:white}video{width:100%;margin-top:20px;border-radius:16px;display:none;background:#000}
    #transcript{color:#cbd5e1;min-height:28px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Clean Air Voice Assistant</h1>
    <div id="status" class="status">กด “เริ่มระบบ” แล้วอนุญาตไมโครโฟน</div>
    <div id="transcript"></div>
    <button id="start">🎤 เริ่มระบบ</button>
    <button id="stop">⛔ หยุด</button>
    <video id="video" controls>
      <source src="clean-air-for-life.mp4" type="video/mp4" />
    </video>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
